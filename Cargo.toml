[package]
name = "patternseer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bytemuck = "1.25.0"
eframe = { version = "0.34.1", features = ["wgpu"] }
enumset = "1.1.10"
env_logger = "0.11.9"
glam = { version = "0.32.1", features = ["bytemuck"] }
pollster = "0.4.0"
rfd = "0.17.2"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.52.1", features = ["rt-multi-thread"] }
wgpu = "29.0.0"
winit = "0.30.13"
